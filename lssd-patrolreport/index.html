<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSSD Patrol Report Generator</title>

<meta property="og:title" content="LSSD Patrol Report Generator">
<meta property="og:description" content="Generate Los Santos Sheriff Department patrol reports in BBCode format.">
<meta property="og:image" content="lssd.png">
<meta property="og:type" content="website">

<meta name="theme-color" content="#2E3E2B">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="favicon.png">

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 1100px;
  margin: auto;
  background-color: #2E3E2B;
  color: #fff;
}

input,
textarea {
  box-sizing: border-box;
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

textarea {
  resize: vertical;
}

button {
  margin-right: 8px;
  padding: 10px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}

.section-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.report-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.card {
  border: 1px solid #ccc;
  padding: 14px;
  border-radius: 6px;
  background: #fff;
  color: #111;
}

.card h4 {
  margin-top: 0;
}

.header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin: 20px 0 30px 0;
  padding-bottom: 10px;
  border-bottom: 2px solid #556B2F;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}

.header img {
  width: 65px;
}

.header h2 {
  margin: 0;
}

.actions {
  margin: 20px 0;
}

#output {
  min-height: 420px;
}

@media (max-width: 800px) {
  .section-grid,
  .report-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="sheriff.png" alt="LSSD Badge">
  <h2>LSSD Patrol Report Generator</h2>
</div>

<div class="section-grid">
  <div class="card">
    <h4>Deputy Information</h4>
    <label>Name:<input id="officerName" placeholder="Answer"></label><br><br>
    <label>Station:<input id="officerStation" placeholder="Answer"></label><br><br>
    <label>Rank:<input id="officerRank" placeholder="Answer"></label><br><br>
    <label>Badge:<input id="officerBadge" placeholder="Answer"></label>
  </div>
</div>

<h3>Patrol Reports</h3>

<div class="report-grid">
  <div class="card">
    <h4>First Report</h4>
    <label>Report Title:<input id="firstTitle" placeholder="Insert Report Title"></label><br><br>
    <label>Date:<input type="date" id="firstDate"></label><br><br>
    <label>Details:<textarea id="firstDetails" rows="8" placeholder="-"></textarea></label><br><br>
    <label>Evidence Image Link 1:<input id="firstEvidence1" placeholder="https://..."></label><br>
    <label>Evidence Image Link 2:<input id="firstEvidence2" placeholder="https://..."></label><br>
    <label>Evidence Image Link 3:<input id="firstEvidence3" placeholder="https://..."></label>
  </div>

  <div class="card">
    <h4>Second Report</h4>
    <label>Report Title:<input id="secondTitle" placeholder="Insert Report Title"></label><br><br>
    <label>Date:<input type="date" id="secondDate"></label><br><br>
    <label>Details:<textarea id="secondDetails" rows="8" placeholder="-"></textarea></label><br><br>
    <label>Evidence Image Link 1:<input id="secondEvidence1" placeholder="https://..."></label><br>
    <label>Evidence Image Link 2:<input id="secondEvidence2" placeholder="https://..."></label><br>
    <label>Evidence Image Link 3:<input id="secondEvidence3" placeholder="https://..."></label>
  </div>
</div>

<div class="actions">
  <button onclick="generate()">Generate Report</button>
  <button onclick="copyOutput()">Copy</button>
  <button onclick="clearForm()">Clear</button>
</div>

<h3>Output</h3>
<textarea id="output" rows="20" readonly></textarea>

<script>
const $ = id => document.getElementById(id);

function valueOrDefault(id, fallback = "Answer") {
  const value = $(id).value.trim();
  return value || fallback;
}

function formatDate(id) {
  const value = $(id).value;
  if (!value) return "-";

  const [year, month, day] = value.split("-");
  return `${day}/${month}/${year}`;
}

function buildEvidence(ids) {
  const evidence = ids
    .map(id => $(id).value.trim())
    .filter(Boolean)
    .map(link => `[spoiler][img]${link}[/img][/spoiler]`);

  return evidence.length ? evidence.join("\n") : "-";
}

function autoBold5W1H(details) {
  if (!details || details === "-") return details;

  const placeholders = [];
  const protect = value => {
    const token = `@@BOLD_${placeholders.length}@@`;
    placeholders.push(value);
    return token;
  };

  let formatted = details.replace(/\[b\][\s\S]*?\[\/b\]/gi, protect);

  const patterns = [
    // When / Kapan
    /\b\d{1,2}\s+(?:Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember|January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}\b/gi,
    /\b\d{1,2}[/-]\d{1,2}[/-]\d{2,4}\b/g,
    /\b(?:pukul|jam|time)\s*\d{1,2}[:.]\d{2}\b/gi,
    /\b\d{1,2}[:.]\d{2}\b/g,

    // Who / Siapa
    /\b(?:Deputy|Officer|Sheriff|Sergeant|Corporal|Lieutenant|Detective)\s+[A-Z][A-Za-z]*(?:\s+[A-Z][A-Za-z]*)*\b/g,
    /\b(?:suspect|witness|korban|pelaku|saksi)\b/gi,

    // Where / Di mana
    /\b[A-Z][A-Za-z]*(?:\s+[A-Z][A-Za-z]*)*\s+(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Drive|Dr|Lane|Ln|Station)\b/g,
    /\b(?:lokasi|location|area)\b/gi,

    // What / Apa
    /\b(?:perampokan bersenjata|armed robbery|robbery|shooting|pursuit|traffic stop|patroli|pemeriksaan|kejadian|incident|violation)\b/gi,

    // How / Bagaimana - vehicle / method details
    /\b(?:kendaraan\s+berjenis|vehicle\s+model|model)\s+[A-Za-z0-9\s-]+?(?=\s+(?:berwarna|dengan|with)|[,.]|$)/gi,
    /\b(?:berwarna|warna|color(?:ed)?)\s+[A-Za-z]+\b/gi,
    /\b(?:Plate(?:\s+Nomor)?|License\s+Plate|Plat(?:e)?(?:\s+Nomor)?)\s*[:#-]?\s*[A-Z0-9-]{2,}\b/gi,

    // Why / Mengapa
    /\b(?:karena|because|reason|alasan|mengapa|kenapa)\b/gi
  ];

  patterns.forEach(pattern => {
    formatted = formatted.replace(pattern, match => protect(`[b]${match}[/b]`));
  });

  return placeholders.reduce(
    (result, value, index) => result.replace(`@@BOLD_${index}@@`, value),
    formatted
  );
}

function buildReport(label, titleId, dateId, detailsId, evidenceIds) {
  const title = valueOrDefault(titleId, "<Insert Report Title>");
  const date = formatDate(dateId);
  const details = autoBold5W1H(valueOrDefault(detailsId, "-"));
  const evidence = buildEvidence(evidenceIds);

  return `[divbox=white]
[b]${label} - ${title}[/b]

[b]Date:[/b]
[divbox=white] ${date} [/divbox]

[b]Details:[/b]
[divbox=white] ${details} [/divbox]

[b]Evidence:[/b]
[divbox=white] 
${evidence}
[/divbox]

[/divbox]`;
}

function generate() {
  const name = valueOrDefault("officerName");
  const station = valueOrDefault("officerStation");
  const rank = valueOrDefault("officerRank");
  const badge = valueOrDefault("officerBadge");

  const firstReport = buildReport(
    "First Report",
    "firstTitle",
    "firstDate",
    "firstDetails",
    ["firstEvidence1", "firstEvidence2", "firstEvidence3"]
  );

  const secondReport = buildReport(
    "Second Report",
    "secondTitle",
    "secondDate",
    "secondDetails",
    ["secondEvidence1", "secondEvidence2", "secondEvidence3"]
  );

  const output = `[divbox=white]
[center][img]https://imagizer.imageshack.com/v2/200x200q70/924/Rs1Hi8.png[/img][/center]
[/divbox]
[divbox=#008040]
[center][b][color=#FFFFFF]Los Santos Sheriff Department[/color][/b][/center]
[/divbox]

[divbox=white]
[center][b]Patrol Report[/b][/center]
[divbox=white]
[b]Name:[/b] ${name}
[b]Station:[/b] ${station}
[b]Rank:[/b] ${rank}
[b]Badge:[/b] ${badge}
[/divbox]

${firstReport}

${secondReport}
[/divbox]`;

  $("output").value = output;
}

function copyOutput() {
  $("output").select();
  document.execCommand("copy");
}

function clearForm() {
  document.querySelectorAll("input, textarea").forEach(input => {
    input.value = "";
  });
  $("output").value = "";
}
</script>

</body>
</html>
