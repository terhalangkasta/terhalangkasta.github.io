<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Audio - Call + Translate</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #075e54;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .call-container {
            background: linear-gradient(145deg, #128C7E, #075e54);
            width: 360px;
            height: 700px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 10px;
            box-sizing: border-box;
        }
        .profile-header { margin-top: 20px; text-align: center; }
        .avatar {
            width: 70px; height: 70px;
            background-color: #dcf8c6; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; color: #075e54; margin: 0 auto 10px;
        }
        .username { font-size: 22px; font-weight: bold; }
        .call-status { font-size: 13px; color: #dcf8c6; margin-top: 5px; height: 20px; }
        
        /* Panel Debug & Kontrol */
        .debug-panel {
            margin-top: 10px;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #ffeb3b;
            max-height: 50px;
            overflow-y: auto;
            text-align: left;
            box-sizing: border-box;
        }
        .audio-debug-controls {
            margin-top: 10px;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .switch {
            position: relative;
            width: 40px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 2px; bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #f44336; }
        input:checked + .slider:before { transform: translateX(20px); }

        .lang-selector { margin-top: 10px; display: flex; gap: 8px; align-items: center; font-size: 12px; width: 100%; justify-content: center; }
        select { padding: 4px; border-radius: 5px; border: none; background: #dcf8c6; color: #075e54; font-weight: bold; }

        .subtitle-box {
            position: absolute;
            bottom: 120px;
            width: 90%;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            min-height: 80px;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }
        .original-text { font-size: 12px; color: #aaa; margin-bottom: 5px; font-style: italic; word-wrap: break-word; }
        .translated-text { font-size: 16px; color: white; font-weight: 500; word-wrap: break-word; }
        
        .controls { position: absolute; bottom: 30px; display: flex; gap: 20px; }
        .btn {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            font-size: 24px; cursor: pointer; display: flex;
            justify-content: center; align-items: center; transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.1); }
        .btn-mic { background-color: #dcf8c6; color: #075e54; }
        .btn-call { background-color: #f44336; color: white; }
        .btn-active { background-color: #4caf50; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
    </style>
</head>
<body>

<div class="call-container">
    <div class="profile-header">
        <div class="avatar">🧑</div>
        <div class="username">Budi (ID)</div>
        <div class="call-status" id="status">Siap menelepon...</div>
    </div>

    <!-- Panel Log Teks -->
    <div class="debug-panel" id="debugLog">Menunggu aksi...</div>

    <!-- Panel Debug Audio -->
    <div class="audio-debug-controls">
        <div class="toggle-row">
            <span>🔊 Echo Mic (Dengar Sendiri)</span>
            <label class="switch">
                <input type="checkbox" id="echoToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div style="font-size:9px; color:#ff9800; text-align:center;">
            ⚠️ WAJIB PAKAI HEADSEAT! Kalau tidak, suara akan pekik!
        </div>
        <div class="toggle-row">
            <span>🗣️ TTS Terjemahan (Dengar Hasil)</span>
            <label class="switch">
                <input type="checkbox" id="ttsToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="lang-selector">
        Bahasa Saya: 
        <select id="langSource">
            <option value="id-ID">Indonesia</option>
            <option value="en-US">English</option>
        </select>
        <span>➡️</span>
        <select id="langTarget">
            <option value="en">English</option>
            <option value="id">Indonesia</option>
        </select>
    </div>

    <div class="subtitle-box">
        <div class="original-text" id="originalText">...</div>
        <div class="translated-text" id="translatedText">Subtitle akan muncul di sini</div>
    </div>

    <div class="controls">
        <button class="btn btn-mic" id="btnMic" onclick="toggleMic()">🎤</button>
        <button class="btn btn-call" onclick="endCall()">📞</button>
    </div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const debugEl = document.getElementById('debugLog');
    
    if (!SpeechRecognition) {
        alert("Browser Anda tidak mendukung Web Speech API. Gunakan Google Chrome.");
    }

    const recognition = new SpeechRecognition();
    recognition.continuous = true; 
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    let isListening = false;

    const statusEl = document.getElementById('status');
    const originalTextEl = document.getElementById('originalText');
    const translatedTextEl = document.getElementById('translatedText');
    const btnMic = document.getElementById('btnMic');
    const langSource = document.getElementById('langSource');
    const langTarget = document.getElementById('langTarget');
    const echoToggle = document.getElementById('echoToggle');
    const ttsToggle = document.getElementById('ttsToggle');

    // ==========================================
    // FITUR 1: DEBUG ECHO MIC (Mendengar Sendiri)
    // ==========================================
    let echoStream = null;
    let audioContext = null;
    let sourceNode = null;

    echoToggle.addEventListener('change', async (e) => {
        if (e.target.checked) {
            try {
                // Meminta akses mikrofon langsung via Web Audio API
                echoStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext();
                sourceNode = audioContext.createMediaStreamSource(echoStream);
                
                // Hubungkan mikrofon langsung ke speaker
                sourceNode.connect(audioContext.destination); 
                logDebug("🔊 DEBUG: Echo Mic NYALA. Sekarang bicara, dengar speaker.");
            } catch (err) {
                logDebug("❌ DEBUG: Mikrofon diblokir oleh browser!");
                e.target.checked = false; // Kembalikan toggle ke mati
            }
        } else {
            // Putuskan koneksi dan matikan mikrofon
            if (sourceNode) sourceNode.disconnect();
            if (audioContext) audioContext.close();
            if (echoStream) echoStream.getTracks().forEach(track => track.stop());
            logDebug("🔇 DEBUG: Echo Mic MATI.");
        }
    });

    // ==========================================
    // FITUR 2: TEXT-TO-SPEECH (Mengucapkan Terjemahan)
    // ==========================================
    function speakTranslation(text) {
        if (!ttsToggle.checked) return; // Jika toggle TTS mati, jangan bicara
        if (!text || text.includes("[Gagal")) return;

        window.speechSynthesis.cancel(); // Hentikan TTS sebelumnya jika ada

        const targetLangVal = langTarget.value;
        // Sesuaikan kode bahasa untuk TTS (id -> id-ID, en -> en-US)
        const ttsLang = targetLangVal === 'en' ? 'en-US' : 'id-ID';

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = ttsLang;
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        
        window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // LOGIC UTAMA SPEECH TO TEXT
    // ==========================================
    function logDebug(msg) {
        console.log(msg);
        debugEl.innerText = msg;
    }

    recognition.onstart = () => {
        logDebug("📡 Sistem: API Speech mendengarkan...");
    };

    recognition.onresult = async (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalTranscript += transcript;
                logDebug("✅ Sistem: Kalimat final tertangkap!");
            } else {
                interimTranscript += transcript;
                logDebug("🎙️ Sistem: Deteksi suara...");
            }
        }

        if (interimTranscript) originalTextEl.innerText = interimTranscript;
        if (finalTranscript) originalTextEl.innerText = finalTranscript;

        if (finalTranscript) {
            statusEl.innerText = "Menerjemahkan...";
            const translated = await translateText(finalTranscript);
            translatedTextEl.innerText = translated;
            statusEl.innerText = "Mendengarkan...";
            
            // Panggil fungsi TTS untuk mengucapkan hasilnya
            speakTranslation(translated);
        }
    };

    recognition.onerror = (event) => {
        logDebug("⚠️ Sistem Error: " + event.error);
        if (event.error === 'not-allowed') {
            statusEl.innerText = "Mikrofon diblokir browser!";
        }
    };

    recognition.onend = () => {
        logDebug("🛑 Sistem: API Speech berhenti (Timeout).");
        if (isListening) {
            setTimeout(() => {
                try {
                    recognition.start();
                    logDebug("🔄 Sistem: Auto-restart...");
                } catch (e) {
                    logDebug("❌ Sistem: Gagal restart.");
                }
            }, 300);
        }
    };

    async function translateText(text) {
        const sourceLangCode = langSource.value.split('-')[0]; 
        const targetLangCode = langTarget.value; 
        
        if(sourceLangCode === targetLangCode) return text;

        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLangCode}|${targetLangCode}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            return data.responseData.translatedText;
        } catch (error) {
            logDebug("❌ Gagal menghubungi API Terjemahan.");
            return "[Gagal menerjemahkan]";
        }
    }

    function toggleMic() {
        if (isListening) {
            isListening = false;
            recognition.stop();
            btnMic.classList.remove('btn-active');
            statusEl.innerText = "Mikrofon mati";
            logDebug("🔕 Mikrofon dimatikan manual.");
        } else {
            isListening = true;
            recognition.lang = langSource.value;
            try {
                recognition.start();
                btnMic.classList.add('btn-active');
                statusEl.innerText = "Mendengarkan...";
                logDebug("🎤 Mikrofon dinyalakan...");
            } catch(e) {
                logDebug("❌ Gagal start API Speech.");
                isListening = false;
            }
        }
    }

    function endCall() {
        if(isListening) toggleMic(); 
        // Matikan echo juga jika masih nyala
        if(echoToggle.checked) {
            echoToggle.checked = false;
            echoToggle.dispatchEvent(new Event('change'));
        }
        window.speechSynthesis.cancel();
        statusEl.innerText = "Panggilan berakhir";
        originalTextEl.innerText = "...";
        translatedTextEl.innerText = "Subtitle akan muncul di sini";
        logDebug("📞 Panggilan diakhiri.");
    }
</script>

</body>
</html>
